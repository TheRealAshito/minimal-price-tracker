<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Picker - {{ product_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569', 500: '#64748b' } } } }
        }
    </script>
    <style>
        #screenshot-container { position: relative; display: inline-block; cursor: default; }
        #screenshot-container img { display: block; max-width: 100%; height: auto; }
        #screenshot-container.mode-navigate { cursor: pointer; }
        #screenshot-container.mode-pick { cursor: crosshair; }
        .element-overlay { position: absolute; border: 2px solid transparent; pointer-events: none; transition: border-color 0.15s, background-color 0.15s; }
        .element-overlay.highlight { border-color: #34d399; background-color: rgba(52, 211, 153, 0.1); }
        .element-overlay.selected { border-color: #f59e0b; background-color: rgba(245, 158, 11, 0.2); box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.4); }
        .spinner { width: 36px; height: 36px; border: 4px solid #334155; border-top: 4px solid #34d399; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .step-item { font-family: monospace; font-size: 12px; }
        .action-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .action-click { background: #1e3a5f; color: #60a5fa; }
        .action-scroll { background: #2d1b4e; color: #c084fc; }
        .action-wait { background: #1a3329; color: #6ee7b7; }
        .action-type { background: #3b2f1a; color: #fbbf24; }
        .action-goto { background: #3b1a1a; color: #f87171; }
    </style>
</head>
<body class="dark bg-dark-900 text-gray-200 min-h-screen flex flex-col">

    <!-- Top Bar -->
    <nav class="bg-dark-800 border-b border-dark-700 sticky top-0 z-50">
        <div class="max-w-full mx-auto px-4 flex items-center justify-between h-12">
            <div class="flex items-center gap-3">
                <a href="/products/{{ product_id }}" class="text-gray-400 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                </a>
                <div>
                    <span class="text-sm font-bold text-white">Element Picker</span>
                    <span class="text-xs text-gray-400 ml-2">{{ product_name }}</span>
                </div>
            </div>

            <!-- Mode Toggle -->
            <div class="flex items-center gap-2">
                <div class="bg-dark-700 rounded-lg p-0.5 flex">
                    <button id="btn-navigate" onclick="setMode('navigate')" class="px-3 py-1 rounded-md text-xs font-medium transition-colors bg-emerald-600 text-white">
                        🖱️ Navigate
                    </button>
                    <button id="btn-pick" onclick="setMode('pick')" class="px-3 py-1 rounded-md text-xs font-medium transition-colors text-gray-400 hover:text-white">
                        🎯 Pick Element
                    </button>
                </div>
                <span id="status-text" class="text-xs text-gray-500 max-w-xs truncate"></span>
            </div>

            <!-- Confirm / Cancel -->
            <div class="flex items-center gap-2">
                <button id="btn-confirm" onclick="confirmSelection()" disabled
                        class="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed text-white px-4 py-1.5 rounded-md text-xs font-medium transition-colors">
                    Confirm Selection
                </button>
            </div>
        </div>
    </nav>

    <div class="flex-1 flex overflow-hidden">
        <!-- Main: Browser Viewport -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- URL Bar -->
            <div class="bg-dark-800 border-b border-dark-700 px-3 py-1.5 flex items-center gap-2">
                <button onclick="goBack()" class="text-gray-500 hover:text-gray-300 p-1" title="Reload page">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                </button>
                <div class="flex-1 bg-dark-700 rounded px-3 py-1 text-xs text-gray-300 font-mono truncate" id="url-display">{{ link.url }}</div>
            </div>

            <!-- Scroll Controls -->
            <div class="bg-dark-800 border-b border-dark-700 px-3 py-1 flex items-center gap-2">
                <span class="text-xs text-gray-500">Scroll:</span>
                <button onclick="doScroll('up', 5)" class="bg-dark-700 hover:bg-dark-600 text-gray-300 px-2 py-0.5 rounded text-xs">↑ Up</button>
                <button onclick="doScroll('down', 5)" class="bg-dark-700 hover:bg-dark-600 text-gray-300 px-2 py-0.5 rounded text-xs">↓ Down</button>
                <div class="border-l border-dark-600 mx-2 h-4"></div>
                <button onclick="doWait(3000)" class="bg-dark-700 hover:bg-dark-600 text-gray-300 px-2 py-0.5 rounded text-xs">⏱ Wait 3s</button>
                <button onclick="doWait(5000)" class="bg-dark-700 hover:bg-dark-600 text-gray-300 px-2 py-0.5 rounded text-xs">⏱ Wait 5s</button>
                <div class="border-l border-dark-600 mx-2 h-4"></div>
                <button onclick="undoLastAction()" class="bg-dark-700 hover:bg-dark-600 text-gray-300 px-2 py-0.5 rounded text-xs">↩ Undo</button>
            </div>

            <!-- Screenshot Area -->
            <div class="flex-1 overflow-auto bg-dark-900 p-2" id="viewport-scroll">
                <!-- Loading -->
                <div id="loading-spinner" class="flex items-center justify-center h-full">
                    <div class="text-center">
                        <div class="spinner mx-auto mb-3"></div>
                        <p class="text-sm text-gray-400">Loading page...</p>
                    </div>
                </div>

                <!-- Screenshot -->
                <div id="screenshot-container" class="hidden mode-navigate">
                    <img id="screenshot-img" src="" alt="Page screenshot" />
                </div>

                <!-- Error -->
                <div id="error-state" class="hidden flex items-center justify-center h-full">
                    <div class="text-center">
                        <p class="text-red-400 text-sm mb-3" id="error-message"></p>
                        <button onclick="startSession()" class="bg-dark-700 hover:bg-dark-600 text-gray-300 px-4 py-2 rounded text-sm">Try Again</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Recorded Actions + Selection -->
        <div class="w-80 bg-dark-800 border-l border-dark-700 flex flex-col overflow-hidden">
            <!-- Selection Preview (shown when element is picked) -->
            <div id="selection-panel" class="border-b border-dark-700 p-3 hidden">
                <h3 class="text-xs font-semibold text-amber-400 uppercase tracking-wider mb-2">🎯 Selected Element</h3>
                <div class="space-y-1.5">
                    <div>
                        <span class="text-xs text-gray-500">Value:</span>
                        <div id="preview-text" class="text-sm font-mono font-bold text-white">—</div>
                    </div>
                    <div>
                        <span class="text-xs text-gray-500">Selector:</span>
                        <div id="preview-selector" class="text-xs font-mono text-gray-400 bg-dark-700 rounded p-1.5 break-all">—</div>
                    </div>
                </div>
            </div>

            <!-- Recorded Actions -->
            <div class="flex-1 overflow-hidden flex flex-col">
                <div class="px-3 py-2 border-b border-dark-700 flex items-center justify-between">
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Recorded Steps</h3>
                    <span id="action-count" class="text-xs text-gray-500">0 steps</span>
                </div>
                <div id="actions-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                    <p class="text-xs text-gray-500 italic p-2">Actions are recorded as you navigate. Click, scroll, and wait actions will appear here.</p>
                </div>

                <!-- Add Manual Step -->
                <div class="border-t border-dark-700 p-2">
                    <div class="flex gap-1">
                        <button onclick="addWaitStep(2000)" class="flex-1 bg-dark-700 hover:bg-dark-600 text-gray-300 px-2 py-1 rounded text-xs">+ 2s Wait</button>
                        <button onclick="addWaitStep(5000)" class="flex-1 bg-dark-700 hover:bg-dark-600 text-gray-300 px-2 py-1 rounded text-xs">+ 5s Wait</button>
                        <button onclick="addWaitStep(10000)" class="flex-1 bg-dark-700 hover:bg-dark-600 text-gray-300 px-2 py-1 rounded text-xs">+ 10s Wait</button>
                    </div>
                    <button onclick="clearActions()" class="w-full mt-1 bg-red-900/30 hover:bg-red-900/50 text-red-400 px-2 py-1 rounded text-xs border border-red-800/50">Clear All Steps</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    const LINK_ID = {{ link.id }};
    const PRODUCT_ID = {{ product_id }};
    const URL = "{{ link.url }}";
    const STORE = "{{ link.store }}";

    let sessionId = null;
    let mode = 'navigate'; // 'navigate' or 'pick'
    let recordedActions = [];
    let selectedElement = null;

    // ── Session lifecycle ──────────────────────────────────────

    async function startSession() {
        showLoading(true);
        try {
            const resp = await fetch('/picker/session/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: URL, store: STORE}),
            });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || 'Failed to start session');
            }
            const data = await resp.json();
            sessionId = data.session_id;
            recordedActions = data.recorded_actions || [];
            updateScreenshot(data.screenshot);
            updateActionsList();
            document.getElementById('url-display').textContent = data.url || URL;
            showLoading(false);
        } catch (e) {
            showError(e.message);
        }
    }

    async function executeAction(type, extra = {}) {
        if (!sessionId) return;
        showLoading(true);
        try {
            const resp = await fetch('/picker/session/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId, type, ...extra}),
            });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || 'Action failed');
            }
            const data = await resp.json();
            recordedActions = data.recorded_actions || [];
            updateScreenshot(data.screenshot);
            updateActionsList();
            document.getElementById('url-display').textContent = data.url || URL;
            showLoading(false);
        } catch (e) {
            showLoading(false);
            document.getElementById('status-text').textContent = 'Error: ' + e.message;
        }
    }

    // ── Click handling ─────────────────────────────────────────

    document.getElementById('screenshot-container').addEventListener('click', async (e) => {
        if (!sessionId) return;
        const img = document.getElementById('screenshot-img');
        const rect = img.getBoundingClientRect();
        const x = Math.round(e.clientX - rect.left);
        const y = Math.round(e.clientY - rect.top);

        if (mode === 'navigate') {
            await executeAction('click', {x, y});
        } else if (mode === 'pick') {
            await pickElement(x, y);
        }
    });

    // Mousewheel scroll on viewport
    document.getElementById('viewport-scroll').addEventListener('wheel', async (e) => {
        if (!sessionId || mode !== 'navigate') return;
        e.preventDefault();
        const direction = e.deltaY > 0 ? 'down' : 'up';
        await executeAction('scroll', {direction, amount: 1});
    }, {passive: false});

    // ── Pick element ───────────────────────────────────────────

    async function pickElement(x, y) {
        if (!sessionId) return;
        try {
            const resp = await fetch('/picker/session/pick', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId, x, y}),
            });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || 'Pick failed');
            }
            const data = await resp.json();
            selectedElement = data;

            // Show selection panel
            document.getElementById('selection-panel').classList.remove('hidden');
            document.getElementById('preview-text').textContent = data.text || '(no text)';
            document.getElementById('preview-selector').textContent = data.selector;
            document.getElementById('btn-confirm').disabled = false;

            // Highlight on screenshot
            highlightElement(data.bbox);
        } catch (e) {
            document.getElementById('status-text').textContent = 'Pick error: ' + e.message;
        }
    }

    function highlightElement(bbox) {
        const container = document.getElementById('screenshot-container');
        container.querySelectorAll('.element-overlay').forEach(el => el.remove());

        const img = document.getElementById('screenshot-img');
        const scaleX = img.clientWidth / 1280;
        const scaleY = img.clientHeight / 900;

        const div = document.createElement('div');
        div.className = 'element-overlay selected';
        div.style.left = (bbox.x * scaleX) + 'px';
        div.style.top = (bbox.y * scaleY) + 'px';
        div.style.width = (bbox.w * scaleX) + 'px';
        div.style.height = (bbox.h * scaleY) + 'px';
        container.appendChild(div);
    }

    // ── Mode toggle ────────────────────────────────────────────

    function setMode(m) {
        mode = m;
        const container = document.getElementById('screenshot-container');
        const btnNav = document.getElementById('btn-navigate');
        const btnPick = document.getElementById('btn-pick');

        if (m === 'navigate') {
            container.className = 'mode-navigate';
            btnNav.className = 'px-3 py-1 rounded-md text-xs font-medium transition-colors bg-emerald-600 text-white';
            btnPick.className = 'px-3 py-1 rounded-md text-xs font-medium transition-colors text-gray-400 hover:text-white';
            document.getElementById('status-text').textContent = 'Navigate mode — click to interact with the page';
        } else {
            container.className = 'mode-pick';
            btnNav.className = 'px-3 py-1 rounded-md text-xs font-medium transition-colors text-gray-400 hover:text-white';
            btnPick.className = 'px-3 py-1 rounded-md text-xs font-medium transition-colors bg-amber-600 text-white';
            document.getElementById('status-text').textContent = 'Pick mode — click on the price element';
        }
    }

    // ── Scroll / Wait controls ─────────────────────────────────

    async function doScroll(direction, amount) {
        await executeAction('scroll', {direction, amount});
    }

    async function doWait(ms) {
        await executeAction('wait', {ms});
    }

    async function goBack() {
        // Reload from original URL
        await executeAction('goto', {url: URL});
    }

    async function undoLastAction() {
        if (!sessionId || recordedActions.length === 0) return;
        showLoading(true);
        try {
            const resp = await fetch('/picker/session/undo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId}),
            });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || 'Undo failed');
            }
            const data = await resp.json();
            recordedActions = data.recorded_actions || [];
            updateScreenshot(data.screenshot);
            updateActionsList();
            showLoading(false);
        } catch (e) {
            showLoading(false);
            document.getElementById('status-text').textContent = 'Undo error: ' + e.message;
        }
    }

    // ── Manual step editor ─────────────────────────────────────

    function addWaitStep(ms) {
        recordedActions.push({type: 'wait', ms});
        updateActionsList();
    }

    function removeStep(index) {
        recordedActions.splice(index, 1);
        updateActionsList();
    }

    function clearActions() {
        recordedActions = [];
        updateActionsList();
    }

    // ── Confirm selection ──────────────────────────────────────

    async function confirmSelection() {
        if (!selectedElement || !sessionId) return;

        const btn = document.getElementById('btn-confirm');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
            const resp = await fetch('/picker/confirm', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    link_id: LINK_ID,
                    selector: selectedElement.selector,
                    preview_text: selectedElement.text || '',
                    pre_actions: recordedActions,
                }),
            });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || 'Save failed');
            }

            // Clean up session
            await fetch('/picker/session/cancel', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId}),
            });

            // Redirect back
            window.location.href = `/products/${PRODUCT_ID}`;
        } catch (e) {
            alert('Error: ' + e.message);
            btn.disabled = false;
            btn.textContent = 'Confirm Selection';
        }
    }

    // ── UI helpers ─────────────────────────────────────────────

    function updateScreenshot(b64) {
        document.getElementById('screenshot-img').src = 'data:image/png;base64,' + b64;
        document.getElementById('screenshot-container').classList.remove('hidden');
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('error-state').classList.add('hidden');
    }

    function showLoading(show) {
        if (show) {
            document.getElementById('loading-spinner').classList.remove('hidden');
            document.getElementById('screenshot-container').classList.add('hidden');
        }
    }

    function showError(msg) {
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('screenshot-container').classList.add('hidden');
        document.getElementById('error-state').classList.remove('hidden');
        document.getElementById('error-message').textContent = msg;
        document.getElementById('status-text').textContent = 'Error';
    }

    function updateActionsList() {
        const list = document.getElementById('actions-list');
        const count = document.getElementById('action-count');
        count.textContent = `${recordedActions.length} steps`;

        if (recordedActions.length === 0) {
            list.innerHTML = '<p class="text-xs text-gray-500 italic p-2">No actions recorded yet. Navigate the page to record steps.</p>';
            return;
        }

        list.innerHTML = recordedActions.map((a, i) => {
            let badge, desc;
            if (a.type === 'click') {
                badge = '<span class="action-badge action-click">CLICK</span>';
                desc = `at (${a.x}, ${a.y})`;
            } else if (a.type === 'scroll') {
                badge = '<span class="action-badge action-scroll">SCROLL</span>';
                desc = `${a.direction || 'down'} ×${a.amount || 3}`;
            } else if (a.type === 'wait') {
                badge = '<span class="action-badge action-wait">WAIT</span>';
                desc = `${(a.ms / 1000).toFixed(0)}s`;
            } else if (a.type === 'type') {
                badge = '<span class="action-badge action-type">TYPE</span>`;
                desc = `"${(a.text || '').substring(0, 20)}"`;
            } else if (a.type === 'goto') {
                badge = '<span class="action-badge action-goto">GOTO</span>';
                desc = (a.url || '').substring(0, 30);
            } else {
                badge = `<span class="action-badge">${a.type}</span>`;
                desc = '';
            }

            return `<div class="flex items-center gap-2 p-1.5 rounded bg-dark-700/50 hover:bg-dark-700 step-item">
                <span class="text-gray-500 text-xs w-4">${i + 1}</span>
                ${badge}
                <span class="text-gray-300 flex-1 truncate">${desc}</span>
                <button onclick="removeStep(${i})" class="text-gray-600 hover:text-red-400 text-xs px-1" title="Remove">✕</button>
            </div>`;
        }).join('');
    }

    // ── Init ───────────────────────────────────────────────────

    setMode('navigate');
    startSession();
    </script>
</body>
</html>
