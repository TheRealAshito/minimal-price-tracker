services:
  price-tracker:
    build: .
    container_name: minimal-price-tracker
    ports:
      # Accessible on LAN for reverse proxy (NPM/nginx).
      # Do NOT expose port 8035 to the internet — use your reverse proxy with SSL.
      - "8035:8035"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
